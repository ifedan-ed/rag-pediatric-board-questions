# LiteLLM gateway entries for the 10 study models. Every request is pinned to one
# OpenRouter provider with fallback disabled; the key is read from the environment.
model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openrouter/openai/gpt-5.6-sol
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          only: [openai]
          allow_fallbacks: false
    model_info:
      route_provider: openai
      route_model: openai/gpt-5.6-sol
      allow_fallbacks: false
